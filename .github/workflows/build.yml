name: Build

on:
  push:
  pull_request:

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # The shell on its own, against the stub core. Green whether or not the
  # core and the web app build on this branch.
  shell:
    name: shell (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v5

      - name: Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            src-tauri
            src-tauri/tools/stub-core

      - name: Stub core into resources/core
        shell: bash
        run: bash src-tauri/tools/use-stub.sh

      # TAURI_CONFIG merges the stub config, so codegen embeds dev-page/
      # instead of needing web/dist.
      - name: fmt, clippy, test
        shell: bash
        working-directory: src-tauri
        run: |
          export TAURI_CONFIG="$(cat tauri.stub.conf.json)"
          cargo fmt --check
          cargo clippy --all-targets -- -D warnings
          cargo test
          cargo clippy --manifest-path tools/stub-core/Cargo.toml --all-targets -- -D warnings

  # The whole app: core publish, web build, tauri build, installers as
  # artifacts. Signing and notarization run only when the secrets exist.
  bundle:
    name: bundle (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            rid: win-x64
          - os: macos-latest
            rid: osx-arm64
    env:
      # Secrets cannot be read in `if:`; these flags can. Names follow the
      # Tauri CLI, which Memories Rescue builds with too.
      HAS_APPLE_SIGNING: ${{ secrets.APPLE_CERTIFICATE != '' }}
      HAS_APPLE_NOTARY: ${{ secrets.APPLE_ID != '' }}
      HAS_WINDOWS_SIGNING: ${{ secrets.AZURE_CLIENT_ID != '' }}
      HAS_UPDATER_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY != '' }}
    steps:
      - uses: actions/checkout@v5

      - name: .NET 10
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.x

      - name: pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 12

      - name: Node 24
        uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml

      - name: Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      # Counts, not a listing: `ls | head` closes the pipe early, and under
      # pipefail the broken pipe failed the step on macOS.
      - name: Publish the core
        shell: bash
        run: |
          rm -rf src-tauri/resources/core
          dotnet publish core/src/Tessera.Api -c Release -r ${{ matrix.rid }} --self-contained -o src-tauri/resources/core
          exe=src-tauri/resources/core/tessera-core${{ runner.os == 'Windows' && '.exe' || '' }}
          test -x "$exe" || { echo "::error::$exe is missing or not executable"; exit 1; }
          files=$(find src-tauri/resources/core -type f | wc -l | tr -d ' ')
          mb=$(du -sm src-tauri/resources/core | cut -f1)
          echo "core publish: $files files, $mb MB"
          echo "core publish (${{ matrix.rid }}): $files files, $mb MB" >> "$GITHUB_STEP_SUMMARY"

      - name: Build the web app
        shell: bash
        run: |
          pnpm --dir web install --frozen-lockfile
          pnpm --dir web build

      # --- signing, gated on secrets that do not exist yet -------------------

      - name: Apple signing identity
        if: runner.os == 'macOS' && env.HAS_APPLE_SIGNING == 'true'
        shell: bash
        run: |
          # The Tauri CLI imports the certificate into a temporary keychain
          # itself when these are set.
          echo "APPLE_CERTIFICATE=${{ secrets.APPLE_CERTIFICATE }}" >> "$GITHUB_ENV"
          echo "APPLE_CERTIFICATE_PASSWORD=${{ secrets.APPLE_CERTIFICATE_PASSWORD }}" >> "$GITHUB_ENV"
          echo "APPLE_SIGNING_IDENTITY=${{ secrets.APPLE_SIGNING_IDENTITY }}" >> "$GITHUB_ENV"

      - name: Apple notarization credentials
        if: runner.os == 'macOS' && env.HAS_APPLE_NOTARY == 'true'
        shell: bash
        run: |
          # With these set the Tauri CLI notarizes and staples the DMG.
          echo "APPLE_ID=${{ secrets.APPLE_ID }}" >> "$GITHUB_ENV"
          echo "APPLE_PASSWORD=${{ secrets.APPLE_PASSWORD }}" >> "$GITHUB_ENV"
          echo "APPLE_TEAM_ID=${{ secrets.APPLE_TEAM_ID }}" >> "$GITHUB_ENV"

      - name: Windows cloud signing (Azure Trusted Signing)
        if: runner.os == 'Windows' && env.HAS_WINDOWS_SIGNING == 'true'
        shell: bash
        run: |
          cargo install trusted-signing-cli --locked
          echo "AZURE_CLIENT_ID=${{ secrets.AZURE_CLIENT_ID }}" >> "$GITHUB_ENV"
          echo "AZURE_CLIENT_SECRET=${{ secrets.AZURE_CLIENT_SECRET }}" >> "$GITHUB_ENV"
          echo "AZURE_TENANT_ID=${{ secrets.AZURE_TENANT_ID }}" >> "$GITHUB_ENV"
          # Every exe, dll and installer goes through this command.
          echo "TAURI_SIGN_CONFIG={\"bundle\":{\"windows\":{\"signCommand\":\"trusted-signing-cli -e ${{ secrets.AZURE_ENDPOINT }} -a ${{ secrets.AZURE_CODE_SIGNING_NAME }} -c ${{ secrets.AZURE_CERT_PROFILE_NAME }} %1\"}}}" >> "$GITHUB_ENV"

      - name: Updater signing key
        if: env.HAS_UPDATER_KEY == 'true'
        shell: bash
        run: |
          echo "TAURI_SIGNING_PRIVATE_KEY=${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}" >> "$GITHUB_ENV"
          echo "TAURI_SIGNING_PRIVATE_KEY_PASSWORD=${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}" >> "$GITHUB_ENV"
          echo "TAURI_UPDATER_CONFIG={\"bundle\":{\"createUpdaterArtifacts\":true}}" >> "$GITHUB_ENV"

      # ----------------------------------------------------------------------

      - name: tauri build
        shell: bash
        working-directory: src-tauri
        run: |
          args=()
          [ -n "${TAURI_SIGN_CONFIG:-}" ] && args+=(--config "$TAURI_SIGN_CONFIG")
          [ -n "${TAURI_UPDATER_CONFIG:-}" ] && args+=(--config "$TAURI_UPDATER_CONFIG")
          pnpm dlx @tauri-apps/cli@2 build "${args[@]}"

      - name: Installers
        uses: actions/upload-artifact@v4
        with:
          name: tessera-desktop-${{ matrix.rid }}
          if-no-files-found: error
          path: |
            src-tauri/target/release/bundle/nsis/*.exe
            src-tauri/target/release/bundle/msi/*.msi
            src-tauri/target/release/bundle/dmg/*.dmg
            src-tauri/target/release/bundle/macos/*.app.tar.gz
            src-tauri/target/release/bundle/**/*.sig

      # The bundle as a buyer runs it: the shell starts the core from the
      # .app's resources. Then the shell is killed outright, and the core must
      # see its stdin close and exit by itself, removing core.pid (no orphans).
      - name: Launch the app (macOS)
        if: runner.os == 'macOS'
        shell: bash
        run: |
          apps=(src-tauri/target/release/bundle/macos/*.app)
          dmgs=(src-tauri/target/release/bundle/dmg/*.dmg)
          app="${apps[0]}"
          dmg="${dmgs[0]}"
          core="$app/Contents/Resources/resources/core/tessera-core"
          test -x "$core" || { echo "::error::$core is missing or not executable"; exit 1; }
          exe="$app/Contents/MacOS/$(/usr/libexec/PlistBuddy -c 'Print :CFBundleExecutable' "$app/Contents/Info.plist")"
          dmg_mb=$(awk -v b="$(stat -f %z "$dmg")" 'BEGIN { printf "%.1f", b / 1048576 }')
          app_mb=$(du -sm "$app" | cut -f1)
          core_files=$(find "$app/Contents/Resources/resources/core" -type f | wc -l | tr -d ' ')

          export TESSERA_DATA_DIR="$RUNNER_TEMP/app-data"
          start=$(date +%s)
          "$exe" > "$RUNNER_TEMP/app.out" 2>&1 &
          shell_pid=$!
          ready=""
          for _ in $(seq 1 90); do
            ready=$(grep -h "ready on 127.0.0.1" "$TESSERA_DATA_DIR"/logs/shell-*.log 2>/dev/null || true)
            [ -n "$ready" ] && break
            sleep 1
          done
          ready_s=$(( $(date +%s) - start ))
          if [ -z "$ready" ]; then
            echo "::error::the shell did not report the core ready within 90 s"
            cat "$RUNNER_TEMP/app.out" "$TESSERA_DATA_DIR"/logs/*.log || true
            kill "$shell_pid" || true
            exit 1
          fi
          echo "$ready"

          sleep 5   # let the web app draw before the screenshot
          screencapture -x "$RUNNER_TEMP/app.png" || echo "no screenshot"
          core_pid=$(cat "$TESSERA_DATA_DIR/core.pid")
          kill "$shell_pid"
          for _ in $(seq 1 40); do
            kill -0 "$core_pid" 2>/dev/null || break
            sleep 0.5
          done
          tail -n 40 "$TESSERA_DATA_DIR"/logs/shell-*.log
          if kill -0 "$core_pid" 2>/dev/null; then
            echo "::error::the core (pid $core_pid) outlived the shell by 20 s"
            kill -9 "$core_pid"
            exit 1
          fi
          test ! -e "$TESSERA_DATA_DIR/core.pid" || { echo "::error::core.pid was left behind"; exit 1; }
          {
            echo "### macOS bundle"
            echo
            echo "| Measure | Value |"
            echo "|---|---|"
            echo "| DMG | $(basename "$dmg"), $dmg_mb MB |"
            echo "| .app on disk | $app_mb MB, core $core_files files |"
            echo "| app launch to core ready (shell log) | about $ready_s s |"
            echo "| shell killed | core exited by itself, core.pid removed |"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Launch screenshot and logs (macOS)
        if: runner.os == 'macOS' && !cancelled()
        uses: actions/upload-artifact@v4
        with:
          name: macos-app-launch
          if-no-files-found: ignore
          path: |
            ${{ runner.temp }}/app.png
            ${{ runner.temp }}/app.out
            ${{ runner.temp }}/app-data/logs/

  # The parts on a Mac without the shell: the core's and the search
  # library's tests, the real model through ModelStore on CoreML and on the
  # CPU, and the published core driven through the contract's handshake
  # (src-tauri/tools/smoke). The numbers land in the job summary.
  smoke-macos:
    name: smoke (macos-latest)
    runs-on: macos-latest
    timeout-minutes: 45
    defaults:
      run:
        shell: bash
    env:
      DOTNET_NOLOGO: 'true'
      DOTNET_CLI_TELEMETRY_OPTOUT: 'true'
    steps:
      - uses: actions/checkout@v5

      - name: .NET 10
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.x

      - name: Build the smoke harness
        run: dotnet build src-tauri/tools/smoke -c Release -o "$RUNNER_TEMP/smoke"

      # The model is 700+ MB. Keyed on the files' sha256s, so a new export
      # gets a new cache entry and nothing stale is ever loaded.
      - name: Model cache key
        id: model-key
        run: |
          id=$(jq -r '.modelId' models/manifest.json)
          sums=$(jq -r '[.files[].sha256] | join(" ")' models/manifest.json | shasum -a 256 | cut -c1-16)
          echo "id=$id" >> "$GITHUB_OUTPUT"
          echo "key=model-$id-$sums" >> "$GITHUB_OUTPUT"

      - name: Restore the model
        id: model-cache
        uses: actions/cache/restore@v4
        with:
          path: ~/tessera-models
          key: ${{ steps.model-key.outputs.key }}

      # ModelStore with the manifest's public URLs, no token; on a cache hit
      # it only verifies the sha256s.
      - name: Download the model
        id: model
        run: |
          "$RUNNER_TEMP/smoke/tessera-smoke" model "$HOME/tessera-models"

      - name: Save the model
        if: steps.model-cache.outputs.cache-hit != 'true' && steps.model.outcome == 'success'
        uses: actions/cache/save@v4
        with:
          path: ~/tessera-models
          key: ${{ steps.model-key.outputs.key }}

      # Every step from here runs even when an earlier one failed, so one
      # run on the Mac reports everything it can.
      - name: dotnet test core
        if: ${{ !cancelled() }}
        run: dotnet test core

      # With the model present the embedder tests run too (CPU against the
      # PyTorch reference vectors, and CoreML when it loads).
      - name: dotnet test search
        if: ${{ !cancelled() }}
        run: |
          if [ "${{ steps.model.outcome }}" = success ]; then
            export TESSERA_MODELS_DIR="$HOME/tessera-models/${{ steps.model-key.outputs.id }}"
          fi
          dotnet test search --logger "console;verbosity=detailed"

      - name: Search with the real model (CoreML and CPU)
        if: ${{ !cancelled() && steps.model.outcome == 'success' }}
        run: |
          "$RUNNER_TEMP/smoke/tessera-smoke" search "$HOME/tessera-models" --require-gpu

      - name: Publish the core (osx-arm64)
        if: ${{ !cancelled() }}
        run: |
          dotnet publish core/src/Tessera.Api -c Release -r osx-arm64 --self-contained -o "$RUNNER_TEMP/core"
          echo "core publish: $(find "$RUNNER_TEMP/core" -type f | wc -l | tr -d ' ') files, $(du -sm "$RUNNER_TEMP/core" | cut -f1) MB"

      - name: A library of generated pictures
        if: ${{ !cancelled() }}
        run: |
          "$RUNNER_TEMP/smoke/tessera-smoke" images "$RUNNER_TEMP/library" --count 50

      - name: The core through the contract's handshake
        if: ${{ !cancelled() }}
        run: |
          models=()
          [ "${{ steps.model.outcome }}" = success ] && models=(--models-from "$HOME/tessera-models" --embeddings)
          "$RUNNER_TEMP/smoke/tessera-smoke" core "$RUNNER_TEMP/core/tessera-core" \
            "$RUNNER_TEMP/library" "$RUNNER_TEMP/data" "${models[@]}" --timeout 600

      # Not a gate. CoreML refuses the shipped vision model on this runner
      # ("Required param 'pad' is missing"; the search step falls back to the
      # CPU). This tries the candidate fixes, so the one proposed for models/
      # or search/ has been seen to work on a Mac:
      #   A  the patch-embedding Conv's padding spelled out, ONNX Runtime as shipped
      #   B  the model as shipped, a newer ONNX Runtime
      #   C  both
      # Remove it once CoreML loads the shipped model.
      - name: CoreML probe (candidate fixes)
        if: ${{ !cancelled() && steps.model.outcome == 'success' }}
        continue-on-error: true
        env:
          NEWER_ORT: 1.31.0
        run: |
          id="${{ steps.model-key.outputs.id }}"
          python3 -m venv "$RUNNER_TEMP/venv"
          "$RUNNER_TEMP/venv/bin/pip" install --quiet onnx
          mkdir -p "$RUNNER_TEMP/patched/$id"
          "$RUNNER_TEMP/venv/bin/python" -I src-tauri/tools/smoke/explicit_pads.py \
            "$HOME/tessera-models/$id/vision.onnx" "$RUNNER_TEMP/patched/$id/vision.onnx"
          cp -c "$HOME/tessera-models/$id/text.onnx" "$HOME/tessera-models/$id/tokenizer.model" "$RUNNER_TEMP/patched/$id/"
          dotnet build src-tauri/tools/smoke -c Release -p:ProbeOnnxRuntime=$NEWER_ORT -o "$RUNNER_TEMP/smoke-ort"
          echo "::group::A: explicit Conv pads, ONNX Runtime as shipped"
          "$RUNNER_TEMP/smoke/tessera-smoke" search "$RUNNER_TEMP/patched" --require-gpu --load-from "$RUNNER_TEMP/patched/$id" || a=$?
          echo "::endgroup::"
          echo "::group::B: model as shipped, ONNX Runtime $NEWER_ORT"
          "$RUNNER_TEMP/smoke-ort/tessera-smoke" search "$HOME/tessera-models" --require-gpu || b=$?
          echo "::endgroup::"
          echo "::group::C: explicit Conv pads, ONNX Runtime $NEWER_ORT"
          "$RUNNER_TEMP/smoke-ort/tessera-smoke" search "$RUNNER_TEMP/patched" --require-gpu --load-from "$RUNNER_TEMP/patched/$id" || c=$?
          echo "::endgroup::"
          echo "probe exits: A ${a:-0}, B ${b:-0}, C ${c:-0}"

      - name: Core logs
        if: ${{ failure() }}
        uses: actions/upload-artifact@v4
        with:
          name: macos-smoke-core-logs
          if-no-files-found: ignore
          path: ${{ runner.temp }}/data/logs/
