[package]
name = "tessera-desktop"
description = "Tessera Desktop: the Tauri shell around the React app and the .NET core"
version = "0.1.0"
edition = "2024"
authors = ["NovaByteWorks"]
repository = "https://github.com/arbaaz360/tessera-desktop"
publish = false

[lib]
# The `_lib` suffix keeps the library name distinct from the binary name,
# which matters on Windows (https://github.com/rust-lang/cargo/issues/8519).
name = "tessera_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-shell = "2"
tauri-plugin-dialog = "2"
tauri-plugin-opener = "2"
tauri-plugin-single-instance = "2"
tauri-plugin-updater = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["sync", "time", "rt"] }
reqwest = { version = "0.13", default-features = false, features = ["rustls", "json", "form", "http2"] }
keyring = "4"
sysinfo = { version = "0.39", default-features = false, features = ["system"] }
base64 = "0.22"
getrandom = "0.3"
chrono = { version = "0.4", default-features = false, features = ["std", "clock"] }
log = { version = "0.4", features = ["std"] }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_System_Threading"] }

[dev-dependencies]
tiny_http = "0.12"
tokio = { version = "1", features = ["sync", "time", "rt", "macros"] }
tempfile = "3"

# Read the optimization guideline for more details: https://tauri.app/concept/size/#cargo-configuration
[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true
